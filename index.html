<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HelixOS</title>
  <link rel="stylesheet" href="css/os.css">
</head>
<body>
  <div id="screen">
    <div id="crt"></div>
    <div id="boot" class="layer"></div>
    <div id="terminal" class="layer hidden">
      <pre id="output" aria-live="polite"></pre>
      <div id="prompt-line">
        <span id="prompt"></span>
        <input id="input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      </div>
    </div>
    <div id="de" class="hidden">
      <div id="de-bar">
        <span class="de-brand">HelixDE</span>
        <span id="de-user"></span>
        <span id="de-clock"></span>
      </div>
      <div id="de-desktop">
        <div id="de-icons"></div>
        <div id="de-windows"></div>
      </div>
    </div>
  </div>
  <script src="js/vfs.js"></script>
  <script src="js/kernel.js"></script>
  <script src="js/commands.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/terminal.js"></script>
  <script src="js/wm.js"></script>
  <script src="js/desktop.js"></script>
  <script src="js/xmlstyle.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
